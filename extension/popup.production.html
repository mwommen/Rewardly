<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #08111f;
        --surface: rgba(255, 255, 255, 0.075);
        --line: rgba(207, 217, 255, 0.16);
        --text: #f8fafc;
        --muted: #a8b3c7;
        --accent: #67e8f9;
        --success: #86efac;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 382px;
        min-height: 480px;
        margin: 0;
        background:
          radial-gradient(circle at 88% -8%, rgba(103, 232, 249, 0.2), transparent 32%),
          linear-gradient(155deg, #101827 0%, #08111f 58%, #050b14 100%);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      button,
      input {
        font: inherit;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid rgba(103, 232, 249, 0.75);
        outline-offset: 3px;
      }
      .shell {
        display: grid;
        gap: 16px;
        padding: 18px;
      }
      .hero,
      .panel {
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
        padding: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      h1,
      h2,
      p {
        margin: 0;
      }
      h1 {
        font-size: 20px;
      }
      h2 {
        color: #fff;
        font-size: 18px;
      }
      p {
        color: var(--muted);
        line-height: 1.45;
      }
      .status-pill {
        border-radius: 999px;
        background: rgba(34, 197, 94, 0.12);
        color: #bbf7d0;
        font-size: 12px;
        font-weight: 850;
        padding: 7px 10px;
      }
      .hero-copy {
        display: grid;
        gap: 7px;
        margin-top: 14px;
      }
      .form {
        display: grid;
        gap: 10px;
      }
      input {
        width: 100%;
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: rgba(5, 12, 24, 0.55);
        color: var(--text);
        padding: 0 12px;
      }
      button {
        min-height: 46px;
        border: 0;
        border-radius: 15px;
        background: linear-gradient(135deg, #67e8f9, #8b5cf6);
        color: #06101f;
        cursor: pointer;
        font-weight: 850;
      }
      button.secondary {
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.07);
        color: #e5efff;
      }
      .wallet-list {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }
      .card-row {
        border-radius: 16px;
        background: rgba(5, 12, 24, 0.42);
        padding: 10px;
      }
      .message {
        color: var(--muted);
        font-size: 13px;
      }
      .message.error {
        color: #fecaca;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <section class="hero">
        <div class="brand">
          <h1>Rewardly</h1>
          <span id="statusPill" class="status-pill">Checking</span>
        </div>
        <div class="hero-copy">
          <h2 id="stateTitle">Checking your connection...</h2>
          <p id="stateBody">Rewardly recommends your best card at supported checkouts.</p>
        </div>
      </section>

      <section id="connectPanel" class="panel hidden">
        <form id="connectForm" class="form">
          <p>Activate on the Rewardly website, then enter the one-time extension code here.</p>
          <input id="connectionCode" aria-label="Rewardly extension connection code" placeholder="Extension connection code" />
          <button type="submit">Connect Rewardly</button>
          <button id="openRewardly" class="secondary" type="button">Open Rewardly</button>
        </form>
      </section>

      <section id="walletPanel" class="panel hidden">
        <h2>Your Wallet</h2>
        <div id="walletList" class="wallet-list"></div>
      </section>

      <section id="actionsPanel" class="panel hidden">
        <button id="retryBtn" type="button">Retry</button>
        <button id="clearSessionBtn" class="secondary" type="button">Reconnect</button>
      </section>

      <p id="message" class="message" role="status" aria-live="polite"></p>
    </div>
    <script src="config.js"></script>
    <script src="popup.production.js"></script>
  </body>
</html>
